<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: white;
      touch-action: none;
      user-select: none;
    }
    #score { font-size: 24px; margin-bottom: 16px; }
    canvas { border: 2px solid #444; display: block; }
    #message {
      margin-top: 16px;
      font-size: 16px;
      color: #aaa;
      text-align: center;
      padding: 0 16px;
      min-height: 24px;
    }
    #buttons { display: flex; gap: 12px; margin-top: 14px; }
    .btn {
      padding: 10px 24px;
      font-family: monospace;
      font-size: 16px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    #btn-normal { background: #00cc44; color: #1a1a1a; }
    #btn-normal:hover { background: #00ff55; }
    #btn-bombs  { background: #ff6600; color: #1a1a1a; }
    #btn-bombs:hover  { background: #ff8800; }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="message"></div>
  <div id="buttons">
    <button id="btn-normal" class="btn">CLASICO</button>
    <button id="btn-bombs"  class="btn">💣 BOMBAS</button>
  </div>

  <script>
    const canvas    = document.getElementById('canvas');
    const ctx       = canvas.getContext('2d');
    const scoreEl   = document.getElementById('score');
    const msgEl     = document.getElementById('message');
    const btnNormal = document.getElementById('btn-normal');
    const btnBombs  = document.getElementById('btn-bombs');

    const GRID    = 20;
    const CELL    = canvas.width / GRID;
    const TICK_MS = 150;
    const TWO_PI  = Math.PI * 2;

    // ── BOMB MODE CONFIG (fácil de ajustar) ─────────────
    const STEPS_PER_SPAWN     = 20; // pasos entre aparición de cada número
    const STEPS_PER_DECREMENT = 3;  // pasos para que el número baje 1
    const MAX_RAY_LENGTH      = 5;  // longitud máxima de rayo antes de que la bomba desaparezca
    // ─────────────────────────────────────────────────────

    const RAY_DIRS = [
      {dx:1,dy:0},{dx:-1,dy:0},
      {dx:0,dy:1},{dx:0,dy:-1},
      {dx:1,dy:1},{dx:-1,dy:-1},
      {dx:1,dy:-1},{dx:-1,dy:1}
    ];

    let snake, dir, next, food, score, loop, started;
    let bombMode, totalSteps, hazards;
    let touchStartX, touchStartY;

    // Estado solo visual (animación fluida entre ticks)
    let prevSnake = [], lastTick = 0;
    let particles = [];
    const exploded = new WeakSet();
    let lastFrame = performance.now();

    // ── INIT ──────────────────────────────────────────────
    function init(withBombs) {
      bombMode   = withBombs;
      snake      = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      prevSnake  = snake.map(s => ({x:s.x, y:s.y}));
      particles  = [];
      dir        = {x:1,y:0};
      next       = {x:1,y:0};
      score      = 0;
      started    = false;
      totalSteps = 0;
      hazards    = [];
      scoreEl.textContent = 'Score: 0';
      msgEl.textContent   = '';
      clearInterval(loop);
      loop = null;
      placeFood();
      draw();
    }

    // ── COMIDA ────────────────────────────────────────────
    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
      } while (
        snake.some(s => s.x===pos.x && s.y===pos.y) ||
        hazards.some(h => cellIsInHazard(pos.x, pos.y, h))
      );
      food = pos;
    }

    function ensureFoodSafe() {
      if (hazards.some(h => cellIsInHazard(food.x, food.y, h))) placeFood();
    }

    // ── LÓGICA DE HAZARDS ─────────────────────────────────
    function cellIsInHazard(x, y, h) {
      if (h.x===x && h.y===y) return true;
      if (h.type==='bomb') {
        for (const {dx,dy} of RAY_DIRS) {
          for (let i=1; i<=h.rayLength; i++) {
            const rx=h.x+dx*i, ry=h.y+dy*i;
            if (rx<0||rx>=GRID||ry<0||ry>=GRID) break;
            if (rx===x && ry===y) return true;
          }
        }
      }
      return false;
    }

    function isDeadly(x, y) {
      return hazards.some(h => h.type==='bomb' && cellIsInHazard(x, y, h));
    }

    function freePos() {
      let pos, attempts=0;
      do {
        pos = { x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID) };
        attempts++;
      } while (attempts<300 && (
        snake.some(s=>s.x===pos.x&&s.y===pos.y) ||
        (food && food.x===pos.x && food.y===pos.y) ||
        hazards.some(h=>h.x===pos.x&&h.y===pos.y)
      ));
      return attempts<300 ? pos : null;
    }

    function spawnNumber() {
      const pos = freePos();
      if (!pos) return;
      hazards.push({ type:'number', x:pos.x, y:pos.y, value:5, stepCount:0 });
    }

    function updateHazards() {
      const toConvert=[], toRemove=[];

      hazards.forEach((h,i) => {
        if (h.type==='number') {
          h.stepCount++;
          if (h.stepCount >= STEPS_PER_DECREMENT) {
            h.value--;
            h.stepCount=0;
            if (h.value<=0) toConvert.push(i);
          }
        } else {
          // bomba: el rayo crece 1 cada paso
          h.rayLength++;
          if (h.rayLength > MAX_RAY_LENGTH) toRemove.push(i);
        }
      });

      // Convertir números a bombas (en orden inverso para no desplazar índices)
      [...toConvert].reverse().forEach(i => {
        const h = hazards[i];
        hazards[i] = { type:'bomb', x:h.x, y:h.y, rayLength:0, stepCount:0 };
      });

      // Eliminar bombas expiradas
      [...toRemove].reverse().forEach(i => hazards.splice(i,1));
    }

    // ── BUCLE DE JUEGO ────────────────────────────────────
    function start() {
      started=true;
      msgEl.textContent='';
      loop=setInterval(tick, TICK_MS);
    }

    function gameOver() {
      clearInterval(loop); loop=null; started=false;
      msgEl.textContent=`Game Over — Puntuación: ${score}`;
    }

    function tick() {
      dir=next;
      prevSnake = snake.map(s => ({x:s.x, y:s.y}));
      lastTick = performance.now();
      const head={ x:snake[0].x+dir.x, y:snake[0].y+dir.y };

      // Colisión con pared / consigo misma
      if (head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)) {
        gameOver(); return;
      }

      snake.unshift(head);

      if (bombMode) {
        totalSteps++;

        // Colisión con bomba o rayo
        if (isDeadly(head.x, head.y)) { gameOver(); return; }

        // ¿La serpiente ha recogido un número?
        const ni=hazards.findIndex(h=>h.type==='number'&&h.x===head.x&&h.y===head.y);
        if (ni!==-1) hazards.splice(ni,1);

        // Actualizar cuentas atrás, rayos, conversiones y expiraciones
        updateHazards();

        // ¿Hay que generar un nuevo número?
        if (totalSteps % STEPS_PER_SPAWN===0) spawnNumber();

        // Reubicar comida si ha quedado bajo un hazard
        ensureFoodSafe();
      }

      // ¿Comida comida?
      if (head.x===food.x && head.y===food.y) {
        score++;
        scoreEl.textContent=`Score: ${score}`;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    // ── ANIMACIÓN (solo visual) ───────────────────────────
    // t = progreso (0..1) entre un tick y el siguiente
    function animT(now) {
      return started ? Math.max(0, Math.min(1, (now - lastTick) / TICK_MS)) : 1;
    }

    function frame(now) {
      const dt = Math.min(50, now - lastFrame);
      lastFrame = now;
      if (bombMode) spawnExplosions();
      updateParticles(dt);
      draw(now);
      requestAnimationFrame(frame);
    }

    // ── PARTÍCULAS ────────────────────────────────────────
    function addParticle(p) {
      if (particles.length < 300) particles.push(p);
    }

    function spawnExplosions() {
      hazards.forEach(h => {
        if (h.type === 'bomb' && !exploded.has(h)) {
          exploded.add(h);
          burst(h);
        }
      });
    }

    function burst(h) {
      const cx = h.x*CELL + CELL/2, cy = h.y*CELL + CELL/2;
      // Chispas en todas direcciones
      for (let i=0; i<24; i++) {
        const a = Math.random()*TWO_PI, v = 70 + Math.random()*190;
        addParticle({ type:'spark', x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
                      life:0, max:350+Math.random()*550, size:0.8+Math.random()*1.6, delay:0 });
      }
      // Chispas más rápidas siguiendo los rayos
      RAY_DIRS.forEach(({dx,dy}) => {
        const a = Math.atan2(dy,dx);
        for (let i=0; i<2; i++) {
          const aa = a + (Math.random()-0.5)*0.35, v = 220 + Math.random()*140;
          addParticle({ type:'spark', x:cx, y:cy, vx:Math.cos(aa)*v, vy:Math.sin(aa)*v,
                        life:0, max:300+Math.random()*300, size:1.4+Math.random(), delay:0 });
        }
      });
      // Humo que aparece cuando baja la llamarada
      for (let i=0; i<7; i++) {
        const a = Math.random()*TWO_PI, v = 8 + Math.random()*26;
        addParticle({ type:'smoke', x:cx+(Math.random()-0.5)*8, y:cy+(Math.random()-0.5)*8,
                      vx:Math.cos(a)*v, vy:Math.sin(a)*v-14,
                      life:0, max:900+Math.random()*700, size:5, delay:250 });
      }
    }

    function updateParticles(dt) {
      const s = dt/1000;
      for (let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        if (p.delay > 0) { p.delay -= dt; continue; }
        p.life += dt;
        if (p.life >= p.max) { particles.splice(i,1); continue; }
        p.x += p.vx*s;
        p.y += p.vy*s;
        const drag = Math.exp(-(p.type==='spark' ? 2.6 : 1.2)*s);
        p.vx *= drag;
        p.vy *= drag;
        if (p.type==='spark') p.vy += 40*s;
      }
    }

    function drawSmoke() {
      ctx.save();
      particles.forEach(p => {
        if (p.type!=='smoke' || p.delay>0) return;
        const k = p.life/p.max;
        const a = 0.26*(1-k)*Math.min(1, p.life/120);
        ctx.fillStyle = `rgba(70,66,62,${a})`;
        dot(p.x, p.y, p.size*(1+2.2*k));
      });
      ctx.restore();
    }

    function drawSparks() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      particles.forEach(p => {
        if (p.type!=='spark' || p.delay>0) return;
        const k = 1 - p.life/p.max;
        ctx.strokeStyle = `rgba(255,${(120+120*k)|0},${(40*k)|0},${k})`;
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx*0.03, p.y - p.vy*0.03);
        ctx.stroke();
      });
      ctx.restore();
    }

    // ── DIBUJO ────────────────────────────────────────────
    function dot(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TWO_PI);
      ctx.fill();
    }

    function draw(now = performance.now()) {
      ctx.fillStyle='#1a1a1a';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      const t = animT(now);

      // Serpiente
      drawSnake(now, t);

      // Comida
      ctx.fillStyle='#ff4444';
      ctx.fillRect(food.x*CELL+1, food.y*CELL+1, CELL-2, CELL-2);

      // Hazards
      if (bombMode) {
        drawSmoke();
        hazards.forEach(h=> h.type==='number' ? drawNumber(h) : drawBomb(h, now, t));
        drawSparks();
      }
    }

    // ── SERPIENTE REALISTA ────────────────────────────────
    function bodyR(u) { return 3 + 5.3*(1 - Math.pow(u, 1.7)); }          // radio: grueso → fino
    function bodyCol(u) { return [62-44*u, 205-107*u, 92-40*u]; }          // color: cabeza → cola
    function rgb(c, k=1, add=0) {
      return `rgb(${Math.min(255,c[0]*k+add)|0},${Math.min(255,c[1]*k+add)|0},${Math.min(255,c[2]*k+add)|0})`;
    }

    // Puntos a lo largo del cuerpo (cabeza → cola), con dirección y posición relativa u (0..1)
    function sampleBody(pts) {
      const segLen = [];
      let total = 0;
      for (let i=0; i<pts.length-1; i++) {
        const l = Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y);
        segLen.push(l); total += l;
      }
      const out = [], STEP = 2.5;
      let acc = 0, lux = 1, luy = 0;
      for (let i=0; i<pts.length-1; i++) {
        const l = segLen[i];
        if (l < 0.01) continue;
        const ux = (pts[i+1].x-pts[i].x)/l, uy = (pts[i+1].y-pts[i].y)/l;
        lux = ux; luy = uy;
        for (let d=0; d<l; d+=STEP) {
          out.push({ x:pts[i].x+ux*d, y:pts[i].y+uy*d, ux, uy, u:(acc+d)/total });
        }
        acc += l;
      }
      const last = pts[pts.length-1];
      out.push({ x:last.x, y:last.y, ux:lux, uy:luy, u:1 });
      return out;
    }

    function drawSnake(now, t) {
      const pts = snake.map((s,i) => {
        const p = prevSnake[i] || s;
        return { x:(p.x+(s.x-p.x)*t)*CELL+CELL/2, y:(p.y+(s.y-p.y)*t)*CELL+CELL/2 };
      });
      const S = sampleBody(pts);
      const n = S.length;

      ctx.save();

      // 1) Contorno
      ctx.fillStyle = '#03180b';
      for (let i=n-1; i>=0; i--) dot(S[i].x, S[i].y, bodyR(S[i].u)+1.5);

      // 2) Base (sombra)
      for (let i=n-1; i>=0; i--) {
        const s=S[i];
        ctx.fillStyle = rgb(bodyCol(s.u), 0.62);
        dot(s.x, s.y, bodyR(s.u));
      }

      // 3) Color medio
      for (let i=n-1; i>=0; i--) {
        const s=S[i], r=bodyR(s.u);
        ctx.fillStyle = rgb(bodyCol(s.u), 1);
        dot(s.x - r*0.1, s.y - r*0.14, r*0.82);
      }

      // 4) Manchas del lomo
      for (let i=n-1; i>=0; i--) {
        const s=S[i], r=bodyR(s.u);
        if (i%6!==0 || s.u<0.07 || r<3.6) continue;
        ctx.fillStyle = rgb(bodyCol(s.u), 0.5);
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, 3.2, r*0.62, Math.atan2(s.uy, s.ux), 0, TWO_PI);
        ctx.fill();
      }

      // 5) Brillo (luz desde arriba-izquierda)
      for (let i=n-1; i>=0; i--) {
        const s=S[i], r=bodyR(s.u);
        ctx.fillStyle = rgb(bodyCol(s.u), 1, 48);
        dot(s.x - r*0.3, s.y - r*0.34, r*0.36);
      }

      // 6) Escamas sutiles (chevrons)
      ctx.strokeStyle = 'rgba(0,35,10,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i=0; i<n; i++) {
        const s=S[i], r=bodyR(s.u);
        if (i%3!==0 || s.u<0.05 || r<3.5) continue;
        const nx=-s.uy, ny=s.ux, fx=-s.ux, fy=-s.uy; // f = hacia la cabeza
        ctx.moveTo(s.x + nx*r*0.7 - fx*r*0.25, s.y + ny*r*0.7 - fy*r*0.25);
        ctx.lineTo(s.x + fx*r*0.3,             s.y + fy*r*0.3);
        ctx.lineTo(s.x - nx*r*0.7 - fx*r*0.25, s.y - ny*r*0.7 - fy*r*0.25);
      }
      ctx.stroke();

      // ── Cabeza ──
      const hp = pts[0];
      const ang = Math.atan2(dir.y, dir.x);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      ctx.translate(hp.x + dir.x*1.5, hp.y + dir.y*1.5);
      ctx.rotate(ang);

      // Lengua bífida (parpadea cada cierto tiempo)
      const c = (now % 1600) / 1600;
      const ext = c < 0.28 ? Math.sin(c/0.28*Math.PI) : 0;
      if (ext > 0.05) {
        const L = 3 + 7*ext, w = Math.sin(now/28)*1.2*ext;
        ctx.strokeStyle = '#e0245e';
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(9, 0);
        ctx.lineTo(9+L, w);
        ctx.moveTo(9+L*0.72, w*0.72); ctx.lineTo(9+L+2, w-2.6*ext);
        ctx.moveTo(9+L*0.72, w*0.72); ctx.lineTo(9+L+2, w+2.6*ext);
        ctx.stroke();
      }

      // Forma de la cabeza: cráneo + hocico
      function headShape(g, ox=0, oy=0) {
        ctx.beginPath(); ctx.arc(ox, oy, 9+g, 0, TWO_PI); ctx.fill();
        ctx.beginPath(); ctx.ellipse(5+ox, oy, 6.5+g, 5.5+g, 0, 0, TWO_PI); ctx.fill();
      }
      // luz fija en el mundo (arriba-izquierda), pasada al sistema de la cabeza
      const lx = -2*ca + -2.4*sa, ly = 2*sa + -2.4*ca;
      ctx.fillStyle = '#03180b';           headShape(1.5);
      ctx.fillStyle = 'rgb(30,120,55)';    headShape(0);
      ctx.fillStyle = 'rgb(62,190,88)';    headShape(-1.4, lx*0.3, ly*0.3);
      ctx.fillStyle = 'rgb(120,235,140)';  headShape(-5, lx, ly);

      // Fosas nasales
      ctx.fillStyle = 'rgba(0,25,5,0.85)';
      dot(9.5, -2.3, 0.8);
      dot(9.5,  2.3, 0.8);

      // Ojos orientados según la dirección
      for (const sy of [-1, 1]) {
        const ey = sy*4.9;
        ctx.fillStyle = '#03180b'; dot(3, ey, 3.2);
        ctx.fillStyle = '#f2d83c'; dot(3, ey, 2.4);
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.ellipse(3.4, ey, 0.8, 2.1, 0, 0, TWO_PI); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.9)'; dot(2.4, ey-0.9, 0.6);
      }

      ctx.restore();
    }

    // ── NÚMEROS (sin cambios) ─────────────────────────────
    function drawNumber(h) {
      ctx.fillStyle='#ffdd00';
      ctx.font=`bold ${Math.round(CELL*0.75)}px monospace`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(h.value, h.x*CELL+CELL/2, h.y*CELL+CELL/2);
    }

    // ── BOMBA Y EXPLOSIÓN REALISTA ────────────────────────
    // Forma de llama (gota alargada) desde (cx,cy) en dirección (ux,uy)
    function flamePath(cx, cy, ux, uy, len, hw, wob) {
      const nx=-uy, ny=ux;
      const tx = cx+ux*len+nx*wob, ty = cy+uy*len+ny*wob;
      const lx = cx+ux*len*0.45+nx*(hw*1.3+wob*0.4), ly = cy+uy*len*0.45+ny*(hw*1.3+wob*0.4);
      const rx = cx+ux*len*0.45-nx*(hw*1.3-wob*0.4), ry = cy+uy*len*0.45-ny*(hw*1.3-wob*0.4);
      ctx.beginPath();
      ctx.moveTo(cx+nx*hw, cy+ny*hw);
      ctx.quadraticCurveTo(lx, ly, tx, ty);
      ctx.quadraticCurveTo(rx, ry, cx-nx*hw, cy-ny*hw);
      ctx.closePath();
      return { tx, ty };
    }

    function drawBomb(h, now, t) {
      const cx = h.x*CELL + CELL/2, cy = h.y*CELL + CELL/2;
      const phase = h.rayLength + t;                      // 0 → ~6 durante la vida de la bomba
      const e = 1 - (1-t)*(1-t);                          // crecimiento rápido al inicio
      const life = Math.max(0.4, 1 - Math.max(0, phase-3.5)*0.24);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      // Llamaradas (misma longitud que los rayos letales)
      RAY_DIRS.forEach(({dx,dy}, k) => {
        const diag = dx!==0 && dy!==0;
        const norm = diag ? Math.SQRT2 : 1;
        const len  = Math.max(0, h.rayLength - 1 + e + 0.5) * CELL * norm;
        if (len < 1) return;
        const ux = dx/norm, uy = dy/norm;
        const wob   = Math.sin(now/55 + k*1.7 + h.x)*2.2 + Math.sin(now/23 + k*3.1)*1.1;
        const pulse = 0.92 + 0.08*Math.sin(now/40 + k);
        const hw    = CELL*0.36*pulse;

        // halo
        flamePath(cx, cy, ux, uy, len*1.02, hw*1.8, wob);
        ctx.fillStyle = `rgba(255,90,0,${0.16*life})`;
        ctx.fill();

        // cuerpo (blanco/amarillo → naranja → rojo)
        const { tx, ty } = flamePath(cx, cy, ux, uy, len, hw, wob);
        const g = ctx.createLinearGradient(cx, cy, tx, ty);
        g.addColorStop(0,   `rgba(255,250,210,${life})`);
        g.addColorStop(0.3, `rgba(255,190,50,${0.95*life})`);
        g.addColorStop(0.7, `rgba(255,80,10,${0.8*life})`);
        g.addColorStop(1,   'rgba(160,10,0,0)');
        ctx.fillStyle = g;
        ctx.fill();

        // núcleo caliente
        flamePath(cx, cy, ux, uy, len*0.7, hw*0.5, wob*0.6);
        ctx.fillStyle = `rgba(255,255,230,${0.75*life})`;
        ctx.fill();
      });

      // Bola de fuego central con destello inicial
      const flash = Math.max(0, 1 - phase/1.3);
      const R = CELL*(0.75 + 0.9*flash) + Math.sin(now/35)*1.2;
      const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      fg.addColorStop(0,    `rgba(255,255,255,${life})`);
      fg.addColorStop(0.25, `rgba(255,240,150,${life})`);
      fg.addColorStop(0.55, `rgba(255,140,20,${0.85*life})`);
      fg.addColorStop(1,    'rgba(200,30,0,0)');
      ctx.fillStyle = fg;
      dot(cx, cy, R);

      // Onda expansiva
      if (phase < 1.6) {
        const p = phase/1.6;
        ctx.strokeStyle = `rgba(255,225,160,${(1-p)*0.7})`;
        ctx.lineWidth = 1 + 2*(1-p);
        ctx.beginPath();
        ctx.arc(cx, cy, CELL*(0.6 + 2.4*(1-(1-p)*(1-p))), 0, TWO_PI);
        ctx.stroke();
      }
      ctx.restore();

      // Bomba negra recortada contra el destello, con mecha encendida
      if (phase < 1.6) {
        const a = 1 - phase/1.6, r = CELL/2 - 2;
        ctx.save();
        ctx.globalAlpha = a;
        const sg = ctx.createRadialGradient(cx-r*0.35, cy-r*0.35, r*0.1, cx, cy, r);
        sg.addColorStop(0, '#8a8a8a'); sg.addColorStop(0.45, '#2a2a2a'); sg.addColorStop(1, '#050505');
        ctx.fillStyle = sg;
        dot(cx, cy, r);

        // mecha
        ctx.strokeStyle = '#9a7a4a';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, cy-r+1);
        ctx.quadraticCurveTo(cx+1, cy-r-5, cx+6, cy-r-6);
        ctx.stroke();

        // chispa de la mecha
        const sx = cx+6, sy = cy-r-6, sr = 2.5 + Math.random()*2;
        ctx.globalCompositeOperation = 'lighter';
        const spg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr*2);
        spg.addColorStop(0,   'rgba(255,255,255,1)');
        spg.addColorStop(0.4, 'rgba(255,200,60,0.9)');
        spg.addColorStop(1,   'rgba(255,100,0,0)');
        ctx.fillStyle = spg;
        dot(sx, sy, sr*2);
        ctx.strokeStyle = 'rgba(255,220,120,0.9)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i=0; i<4; i++) {
          const aa = Math.random()*TWO_PI, l = 3 + Math.random()*4;
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + Math.cos(aa)*l, sy + Math.sin(aa)*l);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    // ── CONTROLES ─────────────────────────────────────────
    function handleDir(d) {
      if (!d) return;
      if (d.x===-dir.x && d.y===-dir.y) return;
      next=d;
      if (!started) start();
    }

    btnNormal.addEventListener('click', ()=>{ if(started) return; init(false); start(); });
    btnBombs.addEventListener('click',  ()=>{ if(started) return; init(true);  start(); });

    document.addEventListener('keydown', e=>{
      const map={
        ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1},
        ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}
      };
      const d=map[e.key]; if(!d) return;
      if (!started) return;
      handleDir(d);
    });

    document.addEventListener('touchstart', e=>{
      touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
    },{passive:true});

    document.addEventListener('touchend', e=>{
      const dx=e.changedTouches[0].clientX-touchStartX;
      const dy=e.changedTouches[0].clientY-touchStartY;
      if (Math.abs(dx)<20&&Math.abs(dy)<20) return;
      const d=Math.abs(dx)>Math.abs(dy)
        ? (dx>0?{x:1,y:0}:{x:-1,y:0})
        : (dy>0?{x:0,y:1}:{x:0,y:-1});
      if (!started) return;
      handleDir(d);
    },{passive:true});

    init(false);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
